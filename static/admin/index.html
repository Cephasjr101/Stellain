<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stellain — Admin Dashboard</title>
<style>
  :root{--bg:#0d1117;--panel:#161b22;--border:#2b3138;--accent:#f5a623;--text:#e6edf3;--muted:#8b949e;--green:#3fb950;--red:#f85149}
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
  body{background:var(--bg);color:var(--text);min-height:100vh}
  .wrap{max-width:1100px;margin:auto;padding:24px 20px}
  .logo{font-size:1.4rem;font-weight:800;color:var(--accent);margin-bottom:20px}
  .logo span{color:var(--text)}
  .btn{cursor:pointer;border:none;border-radius:8px;padding:9px 16px;font-weight:600;font-size:.88rem}
  .btn-accent{background:var(--accent);color:#111}
  .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
  .btn-danger{background:var(--red);color:#fff;padding:6px 12px}
  .btn-sm{padding:6px 12px;font-size:.8rem}
  /* login */
  .login-box{max-width:380px;margin:12vh auto;background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:32px}
  .login-box h2{color:var(--accent);margin-bottom:6px}
  .login-box p{color:var(--muted);font-size:.85rem;margin-bottom:18px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:.78rem;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px}
  .field input,.field select,.field textarea{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:10px 12px;border-radius:8px;font-size:.95rem}
  .err{color:var(--red);font-size:.85rem;margin-top:10px;min-height:1.2em}
  /* stats */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:22px}
  .stat{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:18px}
  .stat b{display:block;font-size:1.6rem;color:var(--accent)}
  .stat small{color:var(--muted)}
  /* tabs & tables */
  .tabs{display:flex;gap:10px;margin-bottom:16px}
  .tab{padding:9px 20px;border-radius:20px;border:1px solid var(--border);background:var(--panel);color:var(--muted);cursor:pointer;font-weight:600}
  .tab.active{background:var(--accent);color:#111;border-color:var(--accent)}
  .panel{display:none}
  .panel.active{display:block}
  table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--border);border-radius:12px;overflow:hidden;font-size:.88rem}
  th,td{padding:10px 12px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
  th{background:#1c2330;color:var(--muted);font-size:.75rem;text-transform:uppercase;letter-spacing:.5px}
  tr:last-child td{border-bottom:none}
  td input,td select,td textarea{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:6px 8px;border-radius:6px;font-size:.85rem;width:100%}
  td input.price{width:90px}
  .pill{display:inline-block;padding:3px 12px;border-radius:12px;font-size:.75rem;font-weight:700}
  .pill.new{background:rgba(245,166,35,.15);color:var(--accent)}
  .pill.contacted{background:rgba(88,166,255,.15);color:#58a6ff}
  .pill.sold{background:rgba(63,185,80,.15);color:var(--green)}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:10px}
  .muted{color:var(--muted);font-size:.85rem}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--green);color:#08210f;font-weight:700;padding:12px 24px;border-radius:10px;display:none;z-index:200}
  .add-form{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:16px}
  .add-form h3{color:var(--accent);margin-bottom:12px;font-size:1rem}
  .row{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px}
  @media(max-width:760px){.row{grid-template-columns:1fr} table{font-size:.78rem} th,td{padding:7px 8px}}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="loginView" class="login-box">
  <div class="logo">Stellain</div>
  <h2>Admin Login</h2>
  <p id="loginHint">Sign in with your admin email & password.</p>
  <div class="field"><label>Email</label><input id="lEmail" type="email" autocomplete="username"></div>
  <div class="field"><label>Password</label><input id="lPass" type="password" autocomplete="current-password"></div>
  <button class="btn btn-accent" style="width:100%" onclick="doLogin()">Sign In</button>
  <div class="err" id="loginErr"></div>
</div>

<!-- ============ DASHBOARD ============ -->
<div id="dashView" class="wrap" style="display:none">
  <div class="topbar">
    <div class="logo" style="margin:0">Stellain <span class="muted" style="font-weight:400">/ Admin</span></div>
    <div style="display:flex;gap:10px">
      <a href="/" target="_blank"><button class="btn btn-ghost btn-sm">View Store ↗</button></a>
      <button class="btn btn-danger btn-sm" onclick="doLogout()">Log Out</button>
    </div>
  </div>

  <div class="stats" id="statsRow"></div>

  <div class="tabs">
    <div class="tab active" onclick="showTab(this,'orders')">📥 Orders <span id="newCount"></span></div>
    <div class="tab" onclick="showTab(this,'listings')">📦 Listings</div>
  </div>

  <!-- ORDERS -->
  <div class="panel active" id="tab-orders">
    <div id="ordersTable"></div>
  </div>

  <!-- LISTINGS -->
  <div class="panel" id="tab-listings">
    <div class="add-form">
      <h3>＋ Add New Item</h3>
      <div class="row">
        <div class="field" style="margin:0"><label>Name</label><input id="aName" placeholder="e.g. Ankara Print Dress"></div>
        <div class="field" style="margin:0"><label>Type</label><select id="aType"><option value="wears">Women's Wears</option><option value="cosmetics">Cosmetics</option><option value="utensils">Utensils</option><option value="appliances">Appliances</option><option value="fashion">Fashion</option></select></div>
        <div class="field" style="margin:0"><label>Price (USD)</label><input id="aPrice" type="number" placeholder="14500"></div>
      </div>
      <div class="field" style="margin:12px 0"><label>Description</label><textarea id="aDesc" placeholder="Condition, specs, shipping info…"></textarea></div>
      <div class="field"><label>Photo</label><input id="aImgFile" type="file" accept="image/*"></div>
      <button class="btn btn-accent" onclick="addItem()">Publish Item</button>
    </div>
    <div id="listingsTable"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
/* ============================================================
   FIREBASE CONFIG — paste your web app config between the quotes.
   Firebase console → Project settings → Your apps → Web app (</>)
   If left blank, the dashboard falls back to ADMIN_TOKEN login.
   ============================================================ */
const firebaseConfig = {
  apiKey: "",
  authDomain: "",
  projectId: "",
  storageBucket: "",
  messagingSenderId: "",
  appId: ""
};

const HAS_FIREBASE = firebaseConfig.apiKey !== "";
const TOKEN_KEY = "admin_idtoken";
const ADMIN_TOKEN_FALLBACK = "Stellarock"; // used only if Firebase config is blank

let fbAuth = null, fbUser = null;

if (HAS_FIREBASE) {
  const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
  const authMod = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js");
  const app = initializeApp(firebaseConfig);
  fbAuth = authMod.getAuth(app);
  window._signIn = (e,p) => authMod.signInWithEmailAndPassword(fbAuth,e,p);
  window._signOut = () => authMod.signOut(fbAuth);
  window._getToken = () => fbAuth.currentUser.getIdToken(true);
  authMod.onAuthStateChanged(fbAuth, async u => {
    fbUser = u;
    if (u) { await afterLogin(await u.getIdToken()); }
  });
  document.getElementById("loginHint").textContent = "Sign in with your Firebase admin account.";
} else {
  document.getElementById("loginHint").textContent = "Firebase not configured — enter ADMIN_TOKEN as password.";
}

async function api(path, opts = {}) {
  const headers = opts.headers || {};
  let token = sessionStorage.getItem(TOKEN_KEY);
  if (HAS_FIREBASE && fbUser) token = await fbUser.getIdToken();
  if (!token && !HAS_FIREBASE) token = ADMIN_TOKEN_FALLBACK;
  headers["Authorization"] = "Bearer " + token;
  if (opts.json) { headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(opts.json); }
  const r = await fetch(path, { ...opts, headers });
  if (r.status === 401 && HAS_FIREBASE) {
    // token expired — force refresh once
    const fresh = await fbUser.getIdToken(true);
    headers["Authorization"] = "Bearer " + fresh;
    const r2 = await fetch(path, { ...opts, headers });
    if (!r2.ok) throw new Error(await r2.text());
    return r2.json();
  }
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

/* ---------- login / logout ---------- */
async function doLogin() {
  const email = document.getElementById("lEmail").value.trim();
  const pass = document.getElementById("lPass").value;
  const err = document.getElementById("loginErr");
  err.textContent = "";
  try {
    if (HAS_FIREBASE) {
      const cred = await window._signIn(email, pass);
      await afterLogin(await cred.user.getIdToken());
    } else {
      sessionStorage.setItem(TOKEN_KEY, pass); // pass = ADMIN_TOKEN
      await afterLogin(pass);
    }
  } catch (e) { err.textContent = "✖ " + (e.message || "Login failed"); }
}
async function afterLogin() {
  document.getElementById("loginView").style.display = "none";
  document.getElementById("dashView").style.display = "block";
  await refreshAll();
}
async function doLogout() {
  if (HAS_FIREBASE) await window._signOut();
  sessionStorage.removeItem(TOKEN_KEY);
  location.reload();
}
document.getElementById("lPass").addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });

/* ---------- tabs ---------- */
function showTab(el, name) {
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
  el.classList.add("active");
  document.getElementById("tab-" + name).classList.add("active");
}

/* ---------- data ---------- */
async function refreshAll() {
  const [stats, orders, items] = await Promise.all([
    api("/api/stats"), api("/api/orders"), api("/api/items")
  ]);
  renderStats(stats);
  renderOrders(orders);
  renderListings(items);
}

function renderStats(s) {
  document.getElementById("statsRow").innerHTML = `
    <div class="stat"><b>${s.total_items}</b><small>Active listings</small></div>
    <div class="stat"><b>${s.total_orders}</b><small>Total orders</small></div>
    <div class="stat"><b>${s.orders_this_week}</b><small>Orders this week</small></div>
    <div class="stat"><b>$${Number(s.order_value_total).toLocaleString()}</b><small>Total order value</small></div>`;
  document.getElementById("newCount").textContent = s.new_orders ? `(${s.new_orders} new)` : "";
}

const fmtDate = ts => new Date(ts * 1000).toLocaleDateString(undefined, { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });

function renderOrders(orders) {
  const el = document.getElementById("ordersTable");
  if (!orders.length) { el.innerHTML = `<p class="muted" style="padding:30px;text-align:center">No orders yet.</p>`; return; }
  el.innerHTML = `<table><thead><tr>
      <th>Date</th><th>Item</th><th>Customer</th><th>Phone</th><th>Note</th><th>Value</th><th>Status</th>
    </tr></thead><tbody>${orders.map(o => `
    <tr>
      <td class="muted">${fmtDate(o.created)}</td>
      <td>${o.item_name}</td>
      <td>${o.customer}</td>
      <td><a href="https://wa.me/${(o.phone||"").replace(/\D/g,"")}" target="_blank" style="color:#58a6ff">${o.phone}</a></td>
      <td class="muted">${o.note || "—"}</td>
      <td>${o.price ? "$" + Number(o.price).toLocaleString() : "—"}</td>
      <td>
        <select onchange="setStatus(${o.id}, this.value)">
          <option value="new" ${o.status==="new"?"selected":""}>🟡 New</option>
          <option value="contacted" ${o.status==="contacted"?"selected":""}>🔵 Contacted</option>
          <option value="sold" ${o.status==="sold"?"selected":""}>🟢 Sold</option>
        </select>
      </td>
    </tr>`).join("")}</tbody></table>`;
}

async function setStatus(id, status) {
  await api("/api/orders/" + id, { method: "PATCH", json: { status } });
  toast("✔ Order marked " + status);
  const s = await api("/api/stats");
  renderStats(s);
}

function renderListings(items) {
  const el = document.getElementById("listingsTable");
  if (!items.length) { el.innerHTML = `<p class="muted" style="padding:30px;text-align:center">No listings.</p>`; return; }
  el.innerHTML = `<table><thead><tr>
      <th style="width:70px">Type</th><th>Name</th><th style="width:100px">Price (USD)</th><th>Description</th><th style="width:90px"></th>
    </tr></thead><tbody>${items.map(i => `
    <tr>
      <td>
        <select id="t_${i.id}"><option value="wears" ${i.type==="wears"?"selected":""}>Wears</option><option value="cosmetics" ${i.type==="cosmetics"?"selected":""}>Cosmetics</option><option value="utensils" ${i.type==="utensils"?"selected":""}>Utensils</option><option value="appliances" ${i.type==="appliances"?"selected":""}>Appliances</option><option value="fashion" ${i.type==="fashion"?"selected":""}>Fashion</option></select>
      </td>
      <td><input id="n_${i.id}" value="${i.name.replace(/"/g,"&quot;")}"></td>
      <td><input class="price" id="p_${i.id}" type="number" value="${i.price}"></td>
      <td><input id="d_${i.id}" value="${(i.desc||"").replace(/"/g,"&quot;")}"></td>
      <td style="white-space:nowrap">
        <button class="btn btn-accent btn-sm" onclick="saveItem(${i.id})">💾</button>
        <button class="btn btn-danger btn-sm" onclick="delItem(${i.id})">✕</button>
      </td>
    </tr>`).join("")}</tbody></table>`;
}

async function saveItem(id) {
  const item = {
    type: document.getElementById("t_" + id).value,
    name: document.getElementById("n_" + id).value.trim(),
    price: parseFloat(document.getElementById("p_" + id).value),
    desc: document.getElementById("d_" + id).value.trim(),
    img: ""  // keep existing image (edit via storefront modal if needed)
  };
  await api("/api/items/" + id, { method: "PUT", json: item });
  toast("✔ Listing updated");
  renderStats(await api("/api/stats"));
}

async function delItem(id) {
  if (!confirm("Delete this listing?")) return;
  await api("/api/items/" + id, { method: "DELETE" });
  toast("✔ Listing deleted");
  await refreshAll();
}

async function addItem() {
  const name = document.getElementById("aName").value.trim();
  const price = parseFloat(document.getElementById("aPrice").value);
  if (!name || !price) { alert("Enter name and price."); return; }
  let img = "";
  const file = document.getElementById("aImgFile").files[0];
  if (file) {
    const fd = new FormData(); fd.append("file", file);
    const up = await api("/api/upload", { method: "POST", body: fd });
    img = up.url;
  }
  await api("/api/items", { method: "POST", json: {
    type: document.getElementById("aType").value, name, price,
    desc: document.getElementById("aDesc").value.trim(), img
  }});
  ["aName","aPrice","aDesc"].forEach(id => document.getElementById(id).value = "");
  document.getElementById("aImgFile").value = "";
  toast("✔ Item published");
  await refreshAll();
}

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.style.display = "block";
  setTimeout(() => t.style.display = "none", 2200);
}

// expose for onclick handlers (module scope)
window.doLogin = doLogin; window.doLogout = doLogout;
window.showTab = showTab; window.setStatus = setStatus;
window.saveItem = saveItem; window.delItem = delItem; window.addItem = addItem;
</script>
</body>
</html>
